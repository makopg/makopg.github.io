<!DOCTYPE html>
<html>
    <head>
        <title>Mako</title>
        <style>
            :root {
                color: #eee;
                background: #121212;
                font-family: 'Segoe UI', sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 2rem;
            }

            div {
                width: min(640px, 100%);
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 24px;
                box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
                padding: 2rem 2.5rem;
                margin: 0.75rem 0;
                backdrop-filter: blur(18px);
            }

            h1 {
                margin: 0 0 0.75rem;
                font-size: clamp(2rem, 2.5vw, 3rem);
                letter-spacing: 0.18em;
                text-transform: uppercase;
            }

            p {
                margin: 0.45rem 0;
                line-height: 1.75;
                color: #d8d8e8;
            }

            .strikethrough {
                text-decoration: line-through solid #f28b82;
                opacity: 0.8;
            }

            em {
                color: #a5d8ff;
            }
        </style>
    </head>
    <body>
        <div>
            <h1>MAKO</h1>
            <p>Yup. That's the name. <br> We <em>(only partial)</em> do stuff.</p>
        </div>

        <div>
            <h1>GAMES</h1>
            <p>· Sandboxer (gmod clone)</p>
            <p class="strikethrough">· Manomaly (secret)</p>
        </div>

        <div>
            <h1>TOOLS</h1>
            <p>· Mako Suite</p>
            <p>· Mako For Unity</p>
        </div>

        <div>
            <h1>CONTACT</h1>
            <p>@trh6dd2 on discord</p>
        </div>
    </body>
</html>
